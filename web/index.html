<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-viewer</title>
<link rel="stylesheet" href="css/cost.css">
<link rel="stylesheet" href="css/stats.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="miniview" class="sv"></div>
<div id="barview" class="sv"></div>
<div id="app">
  <aside id="side">
    <header>
      <h1><span id="live" title="SSE connection"></span> agent-viewer <span class="badge">read-only</span></h1>
      <input id="filter" placeholder="filter projects / sessions…" autocomplete="off">
      <div id="hint">click: open in focused pane · ctrl/shift-click or [split]: open in new pane</div>
      <div id="srcwarn"></div><div id="srcerr"></div>
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="bar">
      <button id="m-sessions" class="on">Sessions</button><button id="m-costs">Costs</button>
      <span id="layoutctl" style="display:flex;gap:6px;align-items:center;margin-left:10px">
      <span>layout</span>
      <button data-layout="cols" title="panes side by side">▥ columns</button>
      <button data-layout="rows" title="panes stacked">▤ rows</button>
      <button data-layout="grid" title="grid">▦ grid</button>
      </span>
      <span class="sp"></span>
      <span id="modectl" hidden><button id="m-mini" title="mini stats window">mini</button><button id="m-bar" title="vertical bar window">bar</button></span>
      <span id="count"></span>
      <button id="fsm" title="smaller font">A−</button><button id="fsp" title="larger font">A+</button><button id="theme" title="theme: auto / light / dark"></button>
    </div>
    <div id="ws"></div>
    <div id="cost" hidden></div>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/cost.js"></script>
<script src="js/bar.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
