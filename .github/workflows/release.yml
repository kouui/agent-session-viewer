name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build (linux, windows console, windows no-console GUI)
        run: make all
      - name: Package
        run: |
          cd dist
          tar czf agent-viewer-linux-amd64.tar.gz agent-viewer-linux
          zip -q agent-viewer-windows-amd64.zip agent-viewer-windows.exe
          zip -q agent-viewer-gui-windows-amd64.zip agent-viewer-gui.exe
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
